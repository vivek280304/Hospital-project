# ===============================
# APPLICATION
# ===============================
spring.application.name=HospitalManagement

# ===============================
# SERVER CONFIGURATION (RENDER)
# ===============================
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION (AIVEN MYSQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===============================
# FLYWAY MIGRATIONS
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# LOGGING
# ===============================
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO

# ===============================
# JWT SECURITY
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# EMAIL CONFIGURATION (RESEND)
# ===============================
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# ===============================
# MINIO OBJECT STORAGE
# ===============================
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME}

# ===============================
# CASHFREE PAYMENT CONFIGURATION
# ===============================
cashfree.client-id=${CASHFREE_CLIENT_ID}
cashfree.client-secret=${CASHFREE_CLIENT_SECRET}
cashfree.base-url=${CASHFREE_BASE_URL}
cashfree.api-version=${CASHFREE_API_VERSION}
cashfree.webhook-url=${CASHFREE_WEBHOOK_URL}